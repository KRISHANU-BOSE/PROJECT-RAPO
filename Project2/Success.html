<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #22d3ee);
            font-family: Arial, sans-serif;
        }

        .box {

            width: 450px;
            padding: 45px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .3);
            transition: 0.4s ease;
        }

        .box:hover {
            transform: scale(1.08);
            box-shadow: 0 20px 50px rgba(255, 215, 0, .5);
        }

        .box h1 {
            color: #16a34a;
            font-size: 30px;
            margin-bottom: 20px;
            white-space: nowrap;
           
        }

        .box p {
            font-size: 20px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .hurray {
            color: #ff6600;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px gold;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: .3s;
        }

        .btn:hover {
            background: orange;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>✅ Payment Successful!</h1>

        <p>
            <span class="hurray">🎉 Hurray!</span><br>
            Thank you for purchasing our plan.<br>
            We appreciate your support!
        </p>

        <a href="card.html" class="btn">⬅ Go Back</a>
    </div>


</body>

</html>
